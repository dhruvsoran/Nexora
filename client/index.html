    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://nexora.app/#organization",
            "name": "Nexora",
            "url": "https://nexora.app/",
            "logo": {
              "@type": "ImageObject",
              "url": "https://nexora.app/favicon.svg"
            },
            "founder": {
              "@type": "Person",
              "name": "Dhruv Soran"
            },
            "sameAs": []
          },
          {
            "@type": "WebSite",
            "@id": "https://nexora.app/#website",
            "url": "https://nexora.app/",
            "name": "Nexora",
            "description": "The project workspace that thinks ahead — boards, milestones, chat and an AI assistant.",
            "publisher": { "@id": "https://nexora.app/#organization" },
            "inLanguage": "en-US"
          }
        ]
      }
    </script>

    <script>
      (function () {
        try {
          var raw = localStorage.getItem('nexora-theme');
          var dark = false;
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.state && typeof parsed.state.dark === 'boolean') dark = parsed.state.dark;
          } else {
            dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          }
          var root = document.documentElement;
          root.classList.toggle('dark', dark);
          root.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
